const head = (n, k, t) => `<header class="hd"><small>No. ${n} — ${k}</small><h2>${t}</h2></header>`;
const JAR = '<svg viewBox="0 0 100 120" width="130" height="156"><rect x="26" y="4" width="48" height="13" rx="4" fill="#C8372D"/><path d="M30 17h40l5 13c4 9 7 20 7 42v26c0 10-6 17-17 17H35c-11 0-17-7-17-17V72c0-22 3-33 7-42z" fill="#fffdf6aa" stroke="#1F2417" stroke-width="3"/><rect x="28" y="70" width="26" height="10" rx="2" fill="#F6B21B" transform="rotate(-16 41 75)"/><rect x="46" y="84" width="28" height="10" rx="2" fill="#F26B5B" transform="rotate(12 60 89)"/><rect x="30" y="96" width="24" height="10" rx="2" fill="#9AA85A" transform="rotate(-8 42 101)"/><rect x="50" y="62" width="22" height="9" rx="2" fill="#fff" stroke="#1F2417" stroke-width="1.5" transform="rotate(20 61 66)"/></svg>';
const dd = (n, c, st = '', d = 0, f = '') => `<svg class="dd ${f}" viewBox="0 0 100 100" style="color:${c};--d:${d}s;${st}"><path pathLength="1" d="${DD[n]}"/></svg>`;
const UND = '<svg class="dd und" viewBox="0 0 100 20" style="--d:.5s"><path pathLength="1" d="M2 12Q12 2 22 12T42 12 62 12 82 12 98 10"/></svg>';
/* ---------- Animations ---------- */
function sparkle(x, y, t){
  const d = document.createElement('div'); d.textContent = t;
  d.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-size:${rand(18, 32)}px;pointer-events:none;z-index:60`;
  document.body.appendChild(d);
  d.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(${rand(-60, 60)}px,-90px) scale(1.2) rotate(${rand(-40, 40)}deg)`, opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => d.remove();
}
function burst(x = innerWidth / 2, y = innerHeight / 2, n = 44){
  for (let i = 0; i < n; i++){
    const ph = i % 7 === 0, d = document.createElement(ph ? 'img' : 'div');
    if (ph){ d.src = PH[(i / 7) % PH.length]; d.style.cssText = 'width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff'; }
    else { d.textContent = E[i % E.length]; d.style.fontSize = rand(18, 34) + 'px'; }
    Object.assign(d.style, { position: 'fixed', left: x + 'px', top: y + 'px', zIndex: 60, pointerEvents: 'none' });
    document.body.appendChild(d);
    const a = rand(0, 6.28), r = rand(120, 320);
    d.animate([{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px),calc(-50% + ${Math.sin(a) * r + 120}px)) rotate(${rand(-360, 360)}deg) scale(1)`, opacity: 0 }], { duration: rand(1200, 2200), easing: 'cubic-bezier(.1,.8,.3,1)' }).onfinish = () => d.remove();
  }
}
const confetti = () => { burst(); setTimeout(() => burst(innerWidth * .2, innerHeight * .4), 300); setTimeout(() => burst(innerWidth * .8, innerHeight * .4), 600); };
(function(){
  const bg = document.createElement('div'); bg.id = 'bg';
  for (let i = 0; i < 20; i++){ const s = document.createElement('span'); s.className = 'rise'; s.textContent = '✦•✧•✦'[i % 5]; s.style.cssText = `color:${['#F6B21B','#F26B5B','#5E6B2F'][i % 3]};left:${rand(0, 95)}%;font-size:${rand(18, 46)}px;animation-duration:${rand(11, 22)}s;animation-delay:-${rand(0, 20)}s`; bg.appendChild(s); }
  document.body.prepend(bg);
  const m = document.createElement('button'); m.id = 'mute'; m.className = 'alt'; m.textContent = '🔊';
  m.onclick = ev => { ev.stopPropagation(); muted = !muted; m.textContent = muted ? '🔇' : '🔊'; if (BG) BG.muted = muted; if (!muted) SFX.chime(); };
  document.body.appendChild(m);
  addEventListener('pointerdown', e => { SFX.pop(); for (let i = 0; i < 3; i++) sparkle(e.clientX, e.clientY, ['💖','✨','🌸'][i]); });
})();

/* ---------- Views ---------- */
function addForm(t){
  return admin ? `<form class="add" data-t="${t}"><b>➕ Add new</b>` + F[t].map(([k, l, ty]) =>
    ty === 'file' ? `<input name="${k}" type="file" accept="image/*,video/*">` :
    ty === 'hidden' ? `<input name="${k}" type="hidden">` :
    `<input name="${k}" placeholder="${esc(l)}" type="${ty || 'text'}">`).join('') +
    (t === 'places' ? '<small>👆 Tap the map above to choose where the pin goes, then save.</small>' : '') + `<button>Save</button></form>` : '';
}
const ctl = (t, id) => admin ? `<p><button class="alt" data-edit="${t}" data-id="${id}">✏️ Edit</button> <button class="alt" data-del="${t}" data-id="${id}">🗑️ Delete</button></p>` : '';
const V = {
  async gallery(){
    const R = [-1.5,1,-1,1.5,-1,1,-1.5,1];
    return `${head('02', 'The Lookbook', 'Photos')}<div class="wall">${ORD.map((p, k) => `<figure class="pol" style="--r:${R[k]}deg;--k:${k}" data-lb="${p}"><img src="${PH[p]}" loading="lazy" alt="${esc(CAP[p])}"><figcaption>Look ${String(k + 1).padStart(2, '0')}<b>${CAP[p]}</b></figcaption></figure>`).join('')}</div>`;
  },
  async note(){
    const n = S.note || 'Write your heartfelt message here (log in as admin and tap Edit).';
    return `${head('01', 'The Note', 'A note for you')}<div class="card"><div class="seal">♥</div><figure class="pol" style="--r:-3deg;max-width:230px;margin:6px auto 16px"><img src="${PH[4]}"><figcaption><b>${CAP[4]}</b></figcaption></figure><div class="dear">Dear ${esc(S.name || 'you')},</div><div class="letter">${esc(n)}</div>
    ${admin ? `<p><button class="alt" data-set="note">✏️ Edit note</button> <button class="alt" data-set="name">Her name</button> <label class="alt" style="padding:10px 16px;border-radius:20px;background:#fff;display:inline-block">🎵 Song <input type="file" accept="audio/*" data-song hidden></label></p>` : ''}</div>`;
  },
  async memories(){
    const r = await rows('memories'); r.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    return `${head('03', 'The Story', 'Our story, stop by stop')}<div class="stks"><span class="stk" data-egg="crown">👑 Clash Royale nights</span><span class="stk">⭐ The Odyssey, together</span></div><div class="tl">` + r.map(m => `<div class="card tm">${media(m.url)}<b>${esc(m.title)}</b> <small>${m.date || ''}</small><p>${esc(m.caption)}</p>${ctl('memories', m.id)}</div>`).join('') + `</div>` + addForm('memories');
  },
  async reasons(){
    const r = await rows('reasons'); S._r = r; S._seen = S._seen || [];
    return `${head('04', 'The Jar', 'Reasons I love you')}<div class="card" style="text-align:center"><div id="jarE">${JAR}</div><div id="jar"><p>Tap the jar 👇</p></div>
      <button class="big" id="pick">Open a reason 💌</button><p><small id="cnt">${S._seen.length}/${r.length} opened</small></p></div>` +
      (admin ? r.map(x => `<div class="card">${esc(x.text)}${ctl('reasons', x.id)}</div>`).join('') : '') + addForm('reasons');
  },
  async quiz(){
    const r = await rows('quiz'); S._q = r; S._i = 0; S._s = 0;
    return `${head('05', 'The Quiz', 'How well do you know us?')}<div class="card" id="qbox"></div>` + (admin ? r.map(x => `<div class="card">${esc(x.question)}${ctl('quiz', x.id)}</div>`).join('') : '') + addForm('quiz');
  },
  async places(){
    const r = await rows('places'); S._p = r;
    return `${head('06', 'The Voyage', 'Our map')}<div class="map" id="map">${r.length > 1 ? `<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M${r.map(p => p.x + ' ' + p.y).join(' L')}"/></svg>` : ''}${r.map((p, i) => `<button class="pin" data-pin="${p.id}" style="left:${p.x}%;top:${p.y}%"><span>${i + 1}</span></button>`).join('')}</div><div id="pinbox"></div>` +
      (admin ? r.map(x => `<div class="card">${esc(x.name)}${ctl('places', x.id)}</div>`).join('') : '') + addForm('places');
  },
  async videos(){
    const r = await rows('videos');
    return head('07', 'The Reveal', 'Videos for you') + (r.length ? r.map((v, i) => `<div class="card reel"><small class="ch">Reel ${i + 1}</small>${media(v.url)}<b>${esc(v.title)}</b>${ctl('videos', v.id)}</div>`).join('') : '<div class="card"><div class="vf">Something special is still being edited. Check back soon.</div></div>') + addForm('videos');
  }
};
function showQ(){
  const b = $('#qbox'); if (!b) return;
  const q = S._q[S._i];
  if (!S._q.length) return b.innerHTML = '<p>Quiz coming soon…</p>';
  if (!q){
    const p = S._s / S._q.length, rimg = PH[p === 1 ? 4 : p >= .6 ? 2 : p >= .3 ? 3 : 5];
    const msg = p === 1 ? "Perfect score?! You know me better than I know myself. Marry me. 💍" : p >= .6 ? "Pretty good! You clearly pay attention… most of the time. 😏" : p >= .3 ? "Hmm. Suspicious. Did you even go on those dates? 🤨💕" : "ZERO?! You're lucky you're cute. Forgiven. 😘";
    if (p >= .6){ confetti(); SFX.fanfare(); }
    return b.innerHTML = `<img class="circ" style="width:140px;height:140px" src="${rimg}">${p === 1 ? '<p class="badge">👑 Three crowns</p>' : ''}<h2>${S._s}/${S._q.length}</h2><p style="text-align:center">${msg}</p><p style="text-align:center"><button onclick="V.quiz().then(h=>{$('#view').innerHTML=h;showQ()})">Play again 🔁</button></p>`;
  }
  const o = (q.options || '').split('|').map(s => s.trim());
  b.innerHTML = `<div class="bar"><i style="width:${S._i / S._q.length * 100}%"></i></div><img class="circ" src="${PH[S._i % PH.length]}"><small>Question ${S._i + 1}/${S._q.length}</small><h3>${esc(q.question)}</h3>` + o.map((t, i) => `<button class="opt" data-a="${i + 1}">${esc(t)}</button>`).join('') + '<p id="fb"></p>';
}

function typeNote(){
  const el = $('.letter'); if (!el) return;
  const full = el.textContent; el.style.minHeight = el.offsetHeight + 'px'; el.textContent = '';
  const gap = Math.min(32, 4500 / Math.max(full.length, 1)); let i = 0;
  (function step(){ if (!el.isConnected) return; el.textContent = full.slice(0, ++i); if (i % 3 === 0) SFX.tick(); if (i < full.length) setTimeout(step, gap); else el.classList.add('done'); })();
}
/* ---------- Shell ---------- */
async function render(){
  const h = await V[tab]();
  app.innerHTML = `<div class="mast"><b>${esc(S.name || 'Miyadha')}</b><span>The Birthday Issue</span><span>Nº ${TABS.findIndex(x => x[0] === tab) + 1}</span></div><div id="view">${h}</div><p class="small">${admin ? '🔧 Admin mode · <a href="#" data-logout>log out</a>' : 'made with love 💖'}</p>
    <nav>${TABS.map(([k, e, l]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}"><i>${e}</i>${l}</button>`).join('')}</nav>`;
  [...$('#view').children].forEach((c, i) => c.style.setProperty('--i', i));
  document.querySelectorAll('#view .card').forEach((c, i) => c.insertAdjacentHTML('beforeend', dd(['mango','olive','spark'][i % 3], ['#F6B21B','#5E6B2F','#F26B5B'][i % 3], '', 1 + i * .15, i % 3 === 1 ? 'corner' : 'f corner')));
  if (tab === 'quiz') showQ();
  if (tab === 'note') typeNote();
  scrollTo({ top: 0, behavior: 'smooth' });
}
function welcome(){
  const ord = [4,2,7,0], rot = [-6,3,-3,5];
  const ds = [['mango','#F6B21B','left:-18px;top:4px;width:46px',2.4,'f'],['spark','#F26B5B','right:-8px;top:-2px;width:34px',2.8,'f'],['olive','#5E6B2F','right:-34px;bottom:8px;width:58px',3.2]];
  const cake = ['M14 88h72','M18 88V64h64v24','M28 64V44h44v20','M18 64q8 9 16 0t16 0 16 0 16 0','M38 44V30M50 44V28M62 44V30'], fire = ['M38 30q-6-8 0-15q6 7 0 15z','M50 28q-6-8 0-15q6 7 0 15z','M62 30q-6-8 0-15q6 7 0 15z'];
  app.innerHTML = `<div class="hero"><div class="mast" style="width:100%"><b>${esc(S.name || 'Miyadha')}</b><span>The Birthday Issue</span><span>Nº 01</span></div>
    <div class="cakewrap">${ds.map(a => dd(...a)).join('')}<div class="cake"><svg class="cakesvg" viewBox="0 0 100 100">${cake.map((d, i) => `<path style="--i:${i}" d="${d}"/>`).join('')}${fire.map(d => `<path class="fl" d="${d}"/>`).join('')}</svg></div></div>
    <h1 class="wave">${wave('Happy Birthday')}</h1>${S.name ? `<h1 class="nm">${esc(S.name)}</h1>` : ''}
    <p class="sub">Your birthday surprise is ready 🎁</p><button class="big" id="start">Blow the candles 🕯️</button>
    <div class="strip">${ord.map((i, k) => `<div class="pol" style="--r:${rot[k]}deg;--k:${k}"><img src="${PH[i]}"></div>`).join('')}</div></div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button,a,div.map,[data-lb],[data-egg],#lb,#jarE'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'lb') return t.remove();
  if (d.egg){ const r = t.getBoundingClientRect(); for (let i = 0; i < 6; i++) setTimeout(() => sparkle(r.x + r.width / 2 + rand(-40, 40), r.y, '👑'), i * 90); SFX.ding(); t.textContent = '👑👑👑 three crowns'; setTimeout(() => t.textContent = '👑 Clash Royale nights', 2200); return; }
  if (d.lb !== undefined){ S._lb = +d.lb; return document.body.insertAdjacentHTML('beforeend', `<div id="lb"><button class="lbn" data-lbn="-1">‹</button><img src="${PH[S._lb]}"><div class="cp">${CAP[S._lb]}</div><button class="lbn r" data-lbn="1">›</button></div>`); }
  if (d.lbn !== undefined){ S._lb = ORD[(ORD.indexOf(S._lb) + +d.lbn + ORD.length) % ORD.length]; $('#lb img').src = PH[S._lb]; $('#lb .cp').textContent = CAP[S._lb]; return SFX.flip(); }
  if (t.id === 'start'){
    t.disabled = true; t.textContent = '🎶'; document.querySelectorAll('.cakesvg').forEach(c => c.classList.add('out')); SFX.blow();
    if (S.song){ BG = new Audio(S.song); BG.loop = true; BG.volume = 0; BG.muted = muted; BG.play().catch(() => {}); let v = 0; setTimeout(() => { const iv = setInterval(() => { BG.volume = Math.min(1, v += .05); if (v >= 1) clearInterval(iv); }, 150); }, 9000); }
    setTimeout(() => { confetti(); SFX.fanfare(); bday(); }, 900);
    return setTimeout(render, 1700);
  }
  if (d.tab){ tab = d.tab; SFX.nav(); SFX.flip(); return render(); }
  if (t.id === 'pick' || t.id === 'jarE'){
    const J = $('#jarE'); J.classList.remove('shake'); void J.offsetWidth; J.classList.add('shake'); SFX.shake(); setTimeout(SFX.chime, 350);
    const left = S._r.filter(r => !S._seen.includes(r.id)), rc = J.getBoundingClientRect();
    if (!left.length){ $('#jar').innerHTML = `<img class="circ" src="${PH[4]}"><div class="slip">That’s all of them… for now 💖</div>`; return burst(rc.x + 40, rc.y + 40, 30); }
    const r = left[Math.floor(Math.random() * left.length)]; S._seen.push(r.id);
    $('#jar').innerHTML = `<img class="circ" src="${PH[Math.floor(Math.random() * PH.length)]}"><div class="slip">${esc(r.text)}</div>`;
    $('#cnt').textContent = `${S._seen.length}/${S._r.length} opened`; return burst(rc.x + 40, rc.y + 40, 24);
  }
  if (d.a){
    const q = S._q[S._i], ok = +d.a === q.answer; if (ok) S._s++;
    document.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i + 1 === q.answer) b.classList.add('right'); });
    if (ok){ burst(e.clientX, e.clientY, 26); SFX.ding(); } else { SFX.bad(); t.classList.add('wrong'); $('#qbox').classList.add('wob'); setTimeout(() => $('#qbox')?.classList.remove('wob'), 600); }
    $('#fb').innerHTML = `<b>${esc(ok ? q.right_msg || 'Yes! 💖' : q.wrong_msg || 'Nope 😜')}</b><br><br><button id="nx">Next ➜</button>`; return;
  }
  if (t.id === 'nx'){ S._i++; return showQ(); }
  if (d.pin){
    const p = S._p.find(x => x.id === d.pin);
    $('#pinbox').innerHTML = `<div class="card">${media(p.url)}<b>${esc(p.name)}</b><p>${esc(p.story)}</p></div>`; SFX.pin(); return burst(e.clientX, e.clientY, 12);
  }
  if (t.id === 'map' && admin){
    const r = t.getBoundingClientRect(), f = document.querySelector('form[data-t=places]');
    f.x.value = ((e.clientX - r.left) / r.width * 100).toFixed(1); f.y.value = ((e.clientY - r.top) / r.height * 100).toFixed(1);
    t.querySelectorAll('.tmp').forEach(n => n.remove());
    t.insertAdjacentHTML('beforeend', `<span class="pin tmp" style="left:${f.x.value}%;top:${f.y.value}%">📌</span>`); return;
  }
  if (d.del && confirm('Delete this?')){ await sb.from(d.del).delete().eq('id', d.id); return render(); }
  if (d.edit){
    const row = (await sb.from(d.edit).select('*').eq('id', d.id).single()).data, upd = {};
    for (const [k, l, ty] of F[d.edit]){ if (ty === 'file' || ty === 'hidden') continue; const v = prompt(l || k, row[k] ?? ''); if (v !== null) upd[k] = ty === 'number' ? +v : v; }
    await sb.from(d.edit).update(upd).eq('id', d.id); return render();
  }
  if (d.set){
    const v = prompt(d.set === 'note' ? 'Your message to her:' : 'Her name:', S[d.set] || '');
    if (v !== null){ await sb.from('settings').upsert({ key: d.set, value: v }); S[d.set] = v; render(); } return;
  }
  if (d.logout !== undefined){ e.preventDefault(); await sb.auth.signOut(); location.hash = ''; location.reload(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.song !== undefined && e.target.files[0]){
    try { const u = await upload(e.target.files[0]); await sb.from('settings').upsert({ key: 'song', value: u }); S.song = u; alert('Song saved 🎵'); } catch (x) { alert(x.message); }
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.t) return; e.preventDefault();
  const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Uploading… (keep this open)';
  try {
    const row = {};
    for (const [k, , ty] of F[f.dataset.t]){
      const el = f[k];
      if (ty === 'file'){ if (el.files[0]) row[k] = await upload(el.files[0]); }
      else if (el.value !== '') row[k] = ty === 'number' || ty === 'hidden' ? +el.value : el.value;
    }
    const { error } = await sb.from(f.dataset.t).insert(row); if (error) throw error;
    burst(); SFX.fanfare(); render();
  } catch (x){ alert('Error: ' + x.message); btn.disabled = false; btn.textContent = 'Save'; }
});

/* ---------- Boot ---------- */
(async () => {
  (await sb.from('settings').select('*')).data?.forEach(r => S[r.key] = r.value);
  let { data: { session } } = await sb.auth.getSession();
  if (!session && location.hash === '#admin'){
    const email = prompt('Admin email'), password = email && prompt('Password');
    if (email){ const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) alert(r.error.message); session = r.data.session; }
  }
  admin = !!session;
  admin ? render() : welcome();
})();
</script>
</body>
</html>
