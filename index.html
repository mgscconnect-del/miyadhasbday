<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
:root{--pink:#ff4f8b;--pink2:#ff8fb8;--ink:#5a1d3d;--sh:0 6px 0 #ff4f8b30,0 14px 30px #ff4f8b22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
figure{margin:0}
body{margin:0;font-family:Fredoka,'Segoe UI',sans-serif;font-size:1.05rem;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(#ffffffaa 3px,transparent 3.5px) 0 0/34px 34px,linear-gradient(125deg,#ffd1e8,#ffe3ef,#fff0f5,#e9ddff,#ffd9e8) 0 0/400% 400%;animation:bg 20s ease infinite}
@keyframes bg{50%{background-position:34px 34px,100% 50%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fi{to{fill-opacity:.92}}
@keyframes up{from{opacity:0;transform:translateY(34px) scale(.9) rotate(var(--r,0deg))}}
@keyframes turn{from{opacity:0;transform:translateX(24px)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-16px) scaleY(1.06)}60%{transform:translateY(0) scaleY(.94)}}
@keyframes bobS{50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{to{transform:rotate(9deg)}}
@keyframes shake{25%{transform:rotate(-12deg) scale(1.08)}75%{transform:rotate(12deg) scale(1.08)}}
@keyframes wob{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes rise{50%{transform:translate(28px,-60vh) rotate(-20deg)}to{transform:translate(-18px,-120vh) rotate(30deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15,1.3) rotate(5deg)}}
@keyframes puff{to{transform:translateY(-14px) scale(2);opacity:0}}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-6deg)}}
@keyframes unfold{from{opacity:0;transform:perspective(600px) rotateX(-80deg)}}
@keyframes march{to{stroke-dashoffset:-120}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rise{position:absolute;bottom:-60px;opacity:.85;animation:rise linear infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}
#lights{position:fixed;top:0;left:0;right:0;height:40px;display:flex;justify-content:space-around;align-items:flex-start;z-index:6;pointer-events:none;padding-top:env(safe-area-inset-top)}
#lights::before{content:'';position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;border-top:2px solid #b78a6a}
#lights i{position:relative;margin-top:var(--y);width:9px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 10px 3px var(--c);animation:twinkle 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s)}
#lights i::before{content:'';position:absolute;top:-5px;left:2px;width:5px;height:6px;background:#8a6a55;border-radius:1px}
main{position:relative;z-index:2;max-width:640px;margin:auto;padding:54px 16px 120px}
#view{animation:turn .5s ease both}
#view>*,.tl>*,.wall .pol{animation:up .7s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0)*.1s)}
.wall .pol{animation-delay:calc(var(--k)*.1s)}
.hd{text-align:center;margin:14px 0 22px}
h2{font-family:Pacifico,cursive;font-weight:400;font-size:2.1rem;line-height:1.2;margin:.2em 0;text-align:center;color:var(--pink);text-shadow:3px 3px 0 #fff,5px 5px 0 #ffc2da}
.hd h2 span{display:inline-block;animation:hop 2s infinite}
.hd p{margin:6px 0 0;font:500 1rem Fredoka;color:#c2457a}
.hd::after{content:'✿ ♡ ✿ ♡ ✿';display:block;letter-spacing:8px;color:var(--pink2);margin-top:6px}
.dd{position:absolute;overflow:visible;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.dd path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards;animation-delay:var(--d,0s)}
.dd.f path{fill:currentColor;fill-opacity:0;animation:draw 1.4s ease forwards,fi .5s ease forwards;animation-delay:var(--d,0s),calc(var(--d,0s) + 1.2s)}
.dd.corner{right:-10px;bottom:-14px;width:38px;height:38px;transform:rotate(12deg)}
button{font:inherit;font-weight:600;background:linear-gradient(135deg,#ff7eb0,#ff4f8b);color:#fff;border:3px solid #fff;border-radius:30px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 #c92f66,0 9px 16px #ff4f8b55;transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #c92f66}
button.alt{background:#fff;color:var(--pink);box-shadow:0 4px 0 #ffc2da}
.card{background:#fffafc;border:3px solid #fff;border-radius:28px;padding:20px 18px 18px;margin:30px 0;box-shadow:var(--sh);position:relative;transform:rotate(var(--r,0deg));transition:transform .3s;outline:2px dashed #ff8fb8;outline-offset:-9px}
.card:nth-of-type(odd){--r:-.7deg}.card:nth-of-type(even){--r:.7deg}
.card:nth-of-type(4n+2){background:#fff0f6}.card:nth-of-type(4n+3){background:#f6f0ff}.card:nth-of-type(4n){background:#fff9de}
.card:hover{transform:translateY(-4px) rotate(0)}
.card::before,.pol::before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:22px;margin-left:-42px;background:repeating-linear-gradient(45deg,#ff8fb8cc 0 6px,#ffc2dacc 6px 12px);transform:rotate(-3deg);z-index:2}
.card::after{content:'🎀';position:absolute;left:-8px;top:-14px;font-size:1.6rem;transform:rotate(-18deg);animation:pulse 2.2s infinite}
.pol::before{width:56px;height:18px;margin-left:-28px;top:-9px}
.m{width:100%;display:block;background:#fff;padding:6px;border-radius:12px;box-shadow:0 8px 20px #ff4f8b2e;margin:0 0 12px}
.vf{background:#fff0f6;border:2px dashed var(--pink2);padding:22px;text-align:center;border-radius:16px;font:600 1.4rem Caveat,cursive;margin-bottom:10px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;background:#fffd;backdrop-filter:blur(12px);padding:6px;border-radius:40px;box-shadow:var(--sh);z-index:7;max-width:96vw;overflow-x:auto}
nav button{background:none;color:var(--ink);box-shadow:none;border:0;padding:5px 9px;display:flex;flex-direction:column;align-items:center;font-size:.64rem;border-radius:24px}
nav button i{font-style:normal;font-size:1.45rem;line-height:1.2}
nav button.on{background:var(--pink);color:#fff}nav button.on i{animation:hop 1.2s infinite}
.hero{display:flex;flex-direction:column;align-items:center;min-height:100vh;text-align:center;padding:56px 0 40px;position:relative}
.hero>*{position:relative;z-index:2}
.ttl{animation:bobS 3s ease-in-out infinite}
.ttl small{display:block;font:400 2.1rem Pacifico,cursive;color:#ff7eb0;text-shadow:2px 2px 0 #fff;transform:rotate(-4deg);margin-bottom:-6px}
.ttl b{display:block;font:400 clamp(3.1rem,16vw,5rem)/1.1 Pacifico,cursive;color:var(--pink);text-shadow:3px 3px 0 #fff,6px 6px 0 #ffc2da}
.ban{display:inline-block;margin:8px 0 4px;padding:4px 26px;background:linear-gradient(135deg,#ff7eb0,#ff4f8b);color:#fff;font:600 1.6rem Fredoka;border:3px solid #fff;border-radius:30px;box-shadow:0 4px 0 #c92f66;transform:rotate(-2deg)}
.frame{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:30px auto 16px}
.frame::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:4px dashed var(--pink2);animation:spin 26s linear infinite}
.frame .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:8px solid #fff;box-shadow:0 12px 28px #ff4f8b55;background:#ffd1e8}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.frame img.on{opacity:1}
.frame .bow{position:absolute;top:-36px;left:50%;margin-left:-.6em;font-size:2.8rem;z-index:3;animation:pulse 2s infinite}
.frame .fx{position:absolute;font-size:1.9rem;animation:hop 2.4s infinite;z-index:3}
.cake{animation:hop 1.8s 3.4s infinite}
.cakesvg{width:188px;height:205px;overflow:visible;filter:drop-shadow(0 12px 10px #9e3f6740);animation:cakeBob 3.4s ease-in-out infinite}
.cakesvg .fl{transform-box:fill-box;transform-origin:50% 90%;animation:flick .55s ease-in-out infinite;filter:drop-shadow(0 0 5px #ffb703)}
.cakesvg.out .fl{animation:puff 1s forwards;animation-delay:0s}
.cakesvg .spark{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cakeBob{50%{transform:translateY(-5px) rotate(-1deg)}}.sub{font-size:1.2rem;margin:6px 0 16px}
.big{font-size:1.4rem;padding:14px 36px;animation:pulse 1.6s infinite}
.pol{background:#fff;padding:8px 8px 12px;border-radius:8px;box-shadow:var(--sh);position:relative;transform:rotate(var(--r,0deg));transition:transform .3s}
.pol:nth-child(3n+1){background:#ffe3ef}.pol:nth-child(3n+2){background:#efe6ff}.pol:nth-child(3n){background:#fff4c9}
.pol img{width:100%;display:block;border-radius:4px}
.pol figcaption{display:block;padding-top:8px;font:500 .66rem Fredoka;letter-spacing:.14em;text-transform:uppercase;color:#c2457a}
.pol figcaption b{display:block;font:600 1.35rem/1.1 Caveat,cursive;letter-spacing:0;text-transform:none;color:var(--ink)}
.wall{columns:2;column-gap:16px}
.wall .pol{break-inside:avoid;margin-bottom:22px;cursor:zoom-in}
.wall .pol:first-child{column-span:all}
.wall .pol:first-child img{max-height:62vh;object-fit:cover;object-position:50% 30%}
.wall .pol:hover{transform:rotate(0) scale(1.05);z-index:2}
.circ{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;border:4px solid #fff;box-shadow:0 0 0 3px var(--pink2),0 6px 14px #ff4f8b44;animation:pop .5s both}
.seal{position:absolute;right:14px;top:-16px;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 3px 6px #0004;z-index:3;animation:pulse 1.6s infinite}
.dear{font:600 1.9rem Caveat,cursive;color:var(--pink);margin:4px 0}
.letter{background:repeating-linear-gradient(transparent 0 31px,#ff8fb855 32px);font:600 1.5rem/32px Caveat,cursive;padding:4px 6px;white-space:pre-wrap}
.letter.done::after{display:none}
.letter::after{content:'';display:inline-block;width:2px;height:1.2em;background:var(--pink);vertical-align:middle;animation:pulse .8s infinite}
.stks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:-6px 0 22px}
.stk{font:500 .85rem Fredoka;padding:6px 14px;border:3px solid #fff;border-radius:999px;background:#fff4c9;box-shadow:0 3px 0 #ffc2da;transform:rotate(-1.5deg)}
.stk[data-egg]{background:#ffd166;cursor:pointer}
.tl{counter-reset:s;margin-left:16px;padding-left:20px;border-left:4px dotted var(--pink2)}
.tm::after{counter-increment:s;content:counter(s);position:absolute;left:-48px;top:18px;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid #fff;box-shadow:0 3px 0 #ffc2da;font:600 .9rem Fredoka;display:grid;place-items:center;transform:none;animation:none}
.tm b{font:600 1.25rem Fredoka}
.tm small{display:inline-block;font:500 .75rem Fredoka;background:#ffe3ef;color:#c2457a;padding:1px 8px;border-radius:999px;margin-left:6px}
.tm small:empty{display:none}
#jarE{display:inline-block;cursor:pointer;animation:hop 2.6s infinite}
#jarE.shake{animation:shake .5s}
.slip{position:relative;background:#fff4c9;border-radius:6px;font:600 1.8rem/1.2 Caveat,cursive;padding:18px 16px;margin:12px 0;transform-origin:top;box-shadow:var(--sh);animation:unfold .6s ease both}
.slip::after{content:'♥';position:absolute;right:-8px;bottom:-12px;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;font:1rem/28px sans-serif;text-align:center}
.ch{display:block;margin-bottom:8px;font:500 .75rem Fredoka;letter-spacing:.2em;text-transform:uppercase;color:#c2457a}
/* Keepsake jar */
.jar-stage{perspective:800px;padding:12px 0 22px;display:grid;place-items:center}
#jarE{display:inline-block;cursor:pointer;transform-style:preserve-3d;filter:drop-shadow(0 18px 12px #5a1d3d30);animation:jarFloat 3s ease-in-out infinite}
#jarE svg{overflow:visible;transform:rotateY(-12deg) rotateX(5deg);transition:transform .35s;filter:drop-shadow(8px 8px 0 #8a345722)}
#jarE:hover svg{transform:rotateY(8deg) rotateX(-2deg) translateY(-5px) scale(1.04)}
#jarE.shake{animation:shake .5s}
@keyframes jarFloat{50%{transform:translateY(-7px) rotateY(4deg)}}
.jar-intro{font:600 1.15rem Caveat,cursive;color:#a74a75;margin:-8px 0 8px}
.jar-count{display:inline-block;background:#fff0f6;padding:5px 13px;border-radius:999px;color:#a74a75}
.jar-slip{max-width:370px;margin:8px auto 14px;min-height:80px;background:linear-gradient(145deg,#fff8dd,#ffeeb5);border:1px solid #fff;box-shadow:0 9px 18px #5a1d3d20, inset 0 1px #fff;border-radius:8px;padding:18px 20px;transform:rotate(-1deg);font:600 1.75rem/1.2 Caveat,cursive;animation:unfold .55s ease both}
/* Story book */
.book{background:#fffaf0;border:4px solid #fff;border-radius:22px;padding:18px 14px 20px;box-shadow:0 8px 0 #c9925c,0 16px 28px #5a1d3d20;position:relative;overflow:hidden}
.book::before{content:'';position:absolute;inset:8px auto 8px 12px;width:5px;border-radius:5px;background:linear-gradient(90deg,#b97948,#f5d7a5,#fff0d0)}
.book-cover{text-align:center;padding:12px 12px 20px 20px;border-bottom:2px dashed #e7c99b}
.book-kicker{font:600 .7rem Fredoka;letter-spacing:.2em;text-transform:uppercase;color:#a66c49}
.book-cover h3{font:400 2rem Pacifico;color:#c2457a;margin:8px 0}
.book-cover p{font:500 .95rem Fredoka;color:#77566a;margin:0}
.book-index{padding:16px 10px 4px 22px}
.book-index h4{font:600 .75rem Fredoka;letter-spacing:.18em;text-transform:uppercase;color:#a66c49;margin:0 0 10px}
.index-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px dotted #d9bd92;font:500 .9rem Fredoka;color:var(--ink)}
.index-row b{font-weight:600;color:#bc4c7a;min-width:0}.index-row small:last-child{max-width:110px;text-align:right;overflow-wrap:anywhere}.index-row small{font-size:.7rem;color:#a66c49}
.book-index a{color:var(--ink);text-decoration:none}.book-index a:hover b{text-decoration:underline}
.story-art{position:relative;overflow:hidden;min-height:190px;margin:12px 0;border:7px solid #fff;border-radius:18px;box-shadow:0 7px 18px #46203922}
.hinge-art{width:min(100%,330px);min-height:300px;margin:16px auto;padding:18px 20px 15px;background:linear-gradient(145deg,#fff0f5,#f8e9ff);border:8px solid #402338;border-radius:38px;box-shadow:0 8px 0 #2d1728,0 15px 22px #5a1d3d28;text-align:center}
.phone-top{display:flex;justify-content:space-between;align-items:center;font:600 1.4rem Fredoka;color:#e95085;border-bottom:1px solid #f3cade;padding-bottom:10px}.phone-top i{font-style:normal;color:#fa5c91}
.hinge-lines{display:flex;justify-content:center;gap:5px;margin:13px}.hinge-lines span{width:5px;height:5px;border-radius:50%;background:#c6a3b6}
.hinge-bubble{margin:30px 0 15px auto;max-width:230px;padding:13px 15px;border-radius:18px 18px 4px 18px;background:#d95d8f;color:#fff;text-align:left;font:500 1rem/1.4 Fredoka;box-shadow:0 4px 0 #a83f70}
.hinge-heart{font-size:2.4rem;color:#f35c90;animation:pulse 1.7s infinite}.hinge-art>small{font:500 .8rem Fredoka;color:#8d6277}
.thread-art{padding:28px 20px;background:linear-gradient(145deg,#fff4df,#ffe8ef);text-align:center}
.thread-label,.thread-line{display:flex;justify-content:space-between;align-items:center;gap:5px}.thread-label{font:600 .72rem Fredoka;color:#9d5975}.thread-label b{color:#e76691;font-size:1.2rem}
.thread-line{position:relative;margin:26px 4px 18px}.thread-line::before{content:'';position:absolute;left:8%;right:8%;top:50%;border-top:3px dashed #dd8ba8}.thread-line i{position:relative;z-index:1;width:38px;height:38px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;background:#fff0f6;font-style:normal;font-size:1.05rem;box-shadow:0 3px 8px #5a1d3d20}.thread-art p{margin:0;font:600 1.2rem Caveat,cursive;color:#9d5975}
.hyd-art{min-height:230px;background:linear-gradient(#bde9ff 0 56%,#f6d49f 56% 60%,#8bbf79 60%);text-align:center}
.hyd-skyline{position:absolute;bottom:39px;left:6%;right:6%;height:100px;display:flex;align-items:flex-end;justify-content:space-around;gap:6px}
.hyd-skyline i{display:block;width:15%;height:55%;background:#f7f0e4;border:3px solid #d4a975;border-bottom:0;border-radius:8px 8px 0 0;position:relative}
.hyd-skyline i:nth-child(2){height:80%;width:18%;background:#f4e4c6}.hyd-skyline i:nth-child(3){height:100%;width:20%;border-radius:50% 50% 0 0;background:#f7e7c5}.hyd-skyline i:nth-child(4){height:68%;background:#fff2dc}
.hyd-phone,.hyd-ticket,.hyd-gift{position:absolute;z-index:2;filter:drop-shadow(0 4px 3px #46303933)}.hyd-phone{left:13%;top:24%;font-size:2.2rem;transform:rotate(-10deg)}.hyd-ticket{right:15%;top:20%;font-size:2.1rem;display:grid}.hyd-ticket small{font:600 .55rem Fredoka;color:#5a1d3d;margin-top:-8px}.hyd-gift{right:34%;top:24%;font-size:2rem}.hyd-art p{position:absolute;bottom:4px;left:0;right:0;margin:0;font:600 .8rem Fredoka;color:#5a1d3d}
.yfactor-art{min-height:210px;background:linear-gradient(140deg,#eee2ff,#f9e7f0);display:grid;place-items:center;text-align:center}
.y-seal{position:absolute;left:18px;top:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#9b6dd0;color:#fff;font:600 1.2rem Pacifico;box-shadow:0 3px 0 #684696}
.y-envelope{position:relative;width:150px;height:100px;border:3px solid #fff;border-radius:10px;background:linear-gradient(155deg,#cbb1ef 0 50%,#a98ad7 50%);box-shadow:0 7px 0 #8566b1,0 12px 18px #5a1d3d22;display:grid;place-items:center;transform:rotate(-4deg)}
.y-envelope span{font-size:2.2rem;color:#fff;filter:drop-shadow(0 2px 2px #70518e)}.y-envelope i{position:absolute;top:-14px;right:-13px;width:32px;height:32px;border:3px solid white;border-radius:50%;background:#fb8db4}.y-envelope i::after{content:'?';display:grid;place-items:center;height:100%;font:600 1rem Fredoka;color:white}
.yfactor-art p{position:absolute;bottom:6px;margin:0;font:600 1rem Caveat,cursive;color:#71518b}
.birth-art{min-height:220px;padding:18px;background:linear-gradient(145deg,#ffeab8,#fff7dd);text-align:center}
.album-title{font:600 .68rem Fredoka;letter-spacing:.18em;color:#9b6d3f}
.album-photos{display:flex;justify-content:center;gap:12px;margin:18px auto 10px}.album-photos span{width:72px;height:83px;padding:8px 5px 12px;border:5px solid #fff;background:#fff1d6;box-shadow:0 4px 8px #5a1d3d25;display:grid;place-items:center;font-size:2rem;transform:rotate(-5deg)}.album-photos span:nth-child(2){transform:rotate(4deg) translateY(5px);background:#ffe6ee}.album-photos span:nth-child(3){transform:rotate(-2deg);background:#e8e1ff}
.album-doodles{font-size:1.2rem;color:#d9899d}.birth-art p{margin:4px 0 0;font:600 1.15rem Caveat,cursive;color:#8b613f}
.chapter-link{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;margin:0;padding:13px 8px;border:0;border-bottom:1px dotted #d9bd92;border-radius:0;background:transparent;color:var(--ink);box-shadow:none;text-align:left;transition:background .15s,transform .15s}
.chapter-link:hover{background:#fff0f6;transform:translateX(3px);box-shadow:none}
.chapter-link b{font:600 1rem Fredoka;color:#bc4c7a}
.chapter-number{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffe3ef;color:#a74a75;font:600 .75rem Fredoka}
.chapter-open{font:500 .72rem Fredoka;color:#9a7055;white-space:nowrap}
.chapter-open i{font-style:normal;font-size:1rem}
.story-back{margin-top:4px}

async function upload(file,onProgress){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const name=crypto.randomUUID()+'.'+ext;
  if(file.size<=6*1024*1024||!window.tus){
    const {error}=await sb.storage.from('media').upload(name,file,{contentType:file.type,cacheControl:'31536000'});
    if(error)throw error; onProgress?.(100);
  }else{
    const {data:{session}}=await sb.auth.getSession();
    const token=session?.access_token||SUPABASE_KEY;
    await new Promise((res,rej)=>{
      new tus.Upload(file,{
        endpoint:`https://${PROJECT_ID}.storage.supabase.co/storage/v1/upload/resumable`,
        retryDelays:[0,1000,3000,5000,10000],
        headers:{authorization:`Bearer ${token}`,apikey:SUPABASE_KEY,'x-upsert':'false'},
        uploadDataDuringCreation:true,
        removeFingerprintOnSuccess:true,
        chunkSize:6*1024*1024,
        metadata:{bucketName:'media',objectName:name,contentType:file.type||'application/octet-stream',cacheControl:'31536000'},
        onError:rej,
        onProgress:(a,b)=>onProgress?.(Math.round(a/b*100)),
        onSuccess:res
      }).start();
    });
  }
  return sb.storage.from('media').getPublicUrl(name).data.publicUrl;
}

function beginRunner(){const g=RG;if(!g)return;clearInterval(MUSIC_TIMER);g.state='running';g.progress=0;g.score=0;g.lives=CONFIG.LIVES;g.stage=1;g.world=0;g.obstacles=[];g.pickups=[];g.gap=110;g.foodCount=0;g.spawn=CONFIG.OBSTACLE_FIRST;g.pickupTimer=1.25;g.playerY=115;g.vy=0;g.grounded=true;g.coyote=0;g.jumpBuffer=0;g.invuln=0;g.slow=0;g.boost=0;g.last=performance.now();g.acc=0;g.frame=0;g.particles=[];$('#runnerStart').hidden=true;$('#runnerAgain').hidden=true;$('#runnerStatus').textContent='The first message: “To care and provide for you.” Here we go!';setStageMood(g.stage);updateHUD();if(!g.raf)g.raf=requestAnimationFrame(runnerFrame)}

function runnerFrame(now){const g=RG;if(!g||!g.canvas.isConnected)return;g.raf=requestAnimationFrame(runnerFrame);if(g.state!=='running'){drawRunner(g);return}const elapsed=Math.min(.1,Math.max(0,(now-g.last)/1000));g.last=now;g.acc+=elapsed;while(g.acc>=CONFIG.STEP&&g.state==='running'){updateRunner(CONFIG.STEP);g.acc-=CONFIG.STEP}drawRunner(g)}

  if (t.id === 'sx') return $('#sheet')?.remove();
  if (d.pin){
    const p = S._p.find(x => x.id === d.pin);
    sheet({ k: 'cu', ic: '💗', n: esc(p.name), t: 'Our pin', x2: media(p.url) + (p.story ? `<p>${esc(p.story)}</p>` : '') }); SFX.pin(); return;
  }
  if (t.id === 'map' && admin){

  if (d.del && confirm('Delete this?')){ const {data,error}=await sb.from(d.del).delete().eq('id', d.id).select('id').maybeSingle();if(error)alert('Could not delete: '+error.message);else if(!data)alert('Nothing was deleted. Check that the signed-in admin ID matches the database policy.');return render(); }

  }

});
document.addEventListener('keydown',e=>{if(tab==='quiz'&&e.code==='Escape'){e.preventDefault();window.togglePause()}});

  if(e.target.dataset.storyPhoto!==undefined&&e.target.files[0]){try{const url=await upload(e.target.files[0]);await saveStoryEdit(e.target.dataset.storyPhoto,{photo:url});S._story=e.target.dataset.storyPhoto;await render()}catch(x){alert('Could not upload story photo: '+x.message)}return;}

/* ---------- Boot ---------- */
(async () => {

  if(settingsResult.error){S._dbErrors={settings:settingsResult.error};}
  else settingsResult.data?.forEach(r=>{

      try{ if(typeof v==='string') v=JSON.parse(v); }catch(e){ v={}; }

<script>
/* pasted endless lane runner integrated */
/* game.js: a simple endless lane runner (Subway-Surfers style).
   Loaded AFTER the main script in index.html. It replaces the old Game tab:
   Miyadha chases Adheeb. Swipe left/right to change lane, up to jump, down to roll.
   Collect hearts and mangoes to close the gap. Hit obstacles and she pulls ahead. */
(() => {
'use strict';
const W = 320, H = 420, HY = 68, PZ = .86, LS = 74, N = 12, STEP = 1 / 60;
const PAL = {H:'#35213e',S:'#f0b391',E:'#291a32',P:'#ff4f91',V:'#8c5fd1',L:'#342940',B:'#ffd16c',D:'#342b43',O:'#5b386a'};
const MIYA = ['..HHHH..','.HHHHHH.','.HSSSSHH','.HSESSHH','..SSSS..','..PPPP..','.PPPPPP.','..VVVV..','.LL..LL.','BB....BB'];
const ADHE = ['..DDDD..','.DDDDDD.','.DSSSSDD','.DSESSDD','..SSSS..','..BBBB..','.BBBBBB.','..OOOO..','.LL..LL.','BB....BB'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GAME_SPOTS = AT;

const sc = z => .18 + .82 * z;
const sy = z => HY + (H - HY) * z;
const sx = (lane, z) => W / 2 + (lane - 1) * LS * sc(z);
const pxr = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); };
const poly = (c, col, p) => { c.fillStyle = col; c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.closePath(); c.fill(); };
const txt = (c, t, x, y, col, size = 8, al = 'center') => { c.fillStyle = col; c.font = 'bold ' + size + 'px monospace'; c.textAlign = al; c.textBaseline = 'middle'; c.fillText(t, x, y); };
const sfx = n => { if (typeof MUTED !== 'undefined' && MUTED) return; try { SFX[n](); } catch (e) {} };
const store = {
  get() { try { return +localStorage.getItem('miyadhaRunnerBest') || 0; } catch (e) { return 0; } },
  set(v) { try { localStorage.setItem('miyadhaRunnerBest', v); } catch (e) {} }
};
const setStatus = t => { const e = document.querySelector('#runnerStatus'); if (e) e.textContent = t; };

const fresh = state => ({ state, t: 0, scroll: 0, speed: .42, score: 0, lives: 3, laneF: 1, target: 1, jumpT: -1, rollT: -1,
  inv: 0, shake: 0, flash: 0, gap: 70, mz: .3, mLane: 1, mTarget: 1, mTimer: 1.5, obs: [], pick: [], dist: 0, spacing: .55,
  parts: [], acc: 0, fc: 0, catches: 0, best: store.get() });

/* ---------------- input ---------------- */
function act(k) {
  const g = RG; if (!g) return;
  if (g.state === 'title' || g.state === 'over') { if (k === 'jump') begin(); return; }
  if (g.state !== 'running') return;
  if (k === 'left') g.target = Math.max(0, g.target - 1);
  else if (k === 'right') g.target = Math.min(2, g.target + 1);
  else if (k === 'jump' && g.jumpT < 0) { g.jumpT = 0; g.rollT = -1; sfx('jump'); }
  else if (k === 'roll' && g.rollT < 0) { g.rollT = 0; if (g.jumpT >= 0) g.jumpT = Math.max(g.jumpT, .75); sfx('duck'); }
}
let lastJump = 0;
window.jumpRunner = () => { const n = performance.now(); if (n - lastJump < 140) return; lastJump = n; act('jump'); };
window.duckRunner = () => act('roll');
window.releaseJump = () => {};
window.togglePause = () => {
  const g = RG; if (!g) return;
  if (g.state === 'running') g.state = 'paused';
  else if (g.state === 'paused') { g.state = 'running'; g.last = performance.now(); g.acc = 0; }
};

function bind(canvas) {
  let id = null, x0 = 0, y0 = 0;
  canvas.addEventListener('pointerdown', e => { e.stopPropagation(); id = e.pointerId; x0 = e.clientX; y0 = e.clientY; try { canvas.setPointerCapture(id); } catch (_) {} });
  canvas.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (Math.hypot(dx, dy) > 26) { id = null; if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right'); else act(dy < 0 ? 'jump' : 'roll'); }
  });
  canvas.addEventListener('pointerup', e => { e.stopPropagation(); if (id === e.pointerId) { id = null; act('jump'); } });
  canvas.addEventListener('pointercancel', () => { id = null; });
  canvas.addEventListener('click', e => e.stopPropagation());
  [['runnerLeft', 'left'], ['runnerRight', 'right'], ['runnerRoll', 'roll'], ['runnerJump', 'jump']].forEach(([i, k]) => {
    const b = document.getElementById(i); if (!b) return;
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); act(k); });
    b.addEventListener('click', e => { e.stopPropagation(); if (e.detail === 0) act(k); });
  });
}
addEventListener('keydown', e => {
  if (typeof tab === 'undefined' || tab !== 'quiz' || !RG) return;
  const m = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'roll', KeyS: 'roll', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' }[e.code];
  if (m) { e.preventDefault(); if (!e.repeat) act(m); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && RG && RG.state === 'running') { RG.state = 'paused'; const b = document.querySelector('#runnerPause'); if (b) b.textContent = 'Resume'; }
});

/* ---------------- game flow ---------------- */
function begin() {
  const g = RG; if (!g) return;
  const keep = { canvas: g.canvas, c: g.c, raf: g.raf };
  Object.assign(g, fresh('running'), keep);
  g.last = performance.now();
  setStatus('Go, Miyadha! Catch Adheeb 💗');
  const p = document.querySelector('#runnerPause'); if (p) p.textContent = 'Pause';
  hud(g);
}
window.beginRunner = begin;
window.retryStage = begin;
window.runnerFrame = () => {};

function init() {
  const canvas = document.querySelector('#runnerCanvas'); if (!canvas) return;
  if (RG && RG.raf) cancelAnimationFrame(RG.raf);
  const g = Object.assign(fresh('title'), { canvas, c: canvas.getContext('2d'), raf: 0, last: performance.now() });
  g.c.imageSmoothingEnabled = false;
  RG = g;
  bind(canvas);
  const loop = now => { if (RG !== g || !canvas.isConnected) return; g.raf = requestAnimationFrame(loop); frame(g, now); };
  g.raf = requestAnimationFrame(loop);
  hud(g);
}
window.initRunner = init;

function hud(g) {
  const st = document.querySelector('#runnerStage'); if (!st) return;
  st.textContent = g.state === 'title' ? 'Ready?' : 'Score ' + Math.floor(g.score);
  document.querySelector('#runnerLives').textContent = '♥'.repeat(Math.max(0, g.lives)) + '♡'.repeat(Math.max(0, 3 - g.lives));
  document.querySelector('#runnerProgress').style.width = Math.round(100 - g.gap) + '%';
  const on = (s, show) => { const e = document.querySelector(s); if (e) e.hidden = !show; };
  on('#runnerStart', g.state === 'title'); on('#runnerAgain', g.state === 'over');
  const p = document.querySelector('#runnerPause'); if (p) p.disabled = !(g.state === 'running' || g.state === 'paused');
}

function frame(g, now) {
  const dt = Math.min(.1, Math.max(0, (now - g.last) / 1000)); g.last = now;
  if (g.state === 'running') {
    g.acc += dt;
    while (g.acc >= STEP) { update(g, STEP); g.acc -= STEP; if (g.state !== 'running') break; }
  } else if (g.state !== 'paused') g.scroll += dt * 3;
  draw(g);
  if (++g.fc % 8 === 0) hud(g);
}

/* ---------------- rules ---------------- */
function spawn(g) {
  const R = Math.random(), L = [0, 1, 2], pk = a => a[Math.floor(Math.random() * a.length)];
  const free = pk(L); let extra = 0;
  if (R < .2) { L.forEach(l => g.obs.push({ lane: l, z: 0, type: 'low' })); extra = .22; }
  else if (R < .32) { L.forEach(l => g.obs.push({ lane: l, z: 0, type: 'high' })); extra = .22; }
  else if (R < .78) {
    const blocked = L.filter(l => l !== free && Math.random() < .7);
    if (!blocked.length) blocked.push(L.find(l => l !== free));
    blocked.forEach(l => g.obs.push({ lane: l, z: 0, type: 'tall' }));
  } else g.obs.push({ lane: pk(L), z: 0, type: Math.random() < .5 ? 'low' : 'tall' });
  if (Math.random() < .65) {
    const mango = Math.random() < .18;
    for (let i = 0; i < (mango ? 1 : 3); i++) g.pick.push({ lane: free, z: -.05 - i * .075, kind: mango ? 'mango' : 'heart' });
  }
  g.spacing = Math.max(.5, .64 - g.t * .0015) + extra;
}
function burstParts(g, x, y, n, ch) {
  for (let i = 0; i < n; i++) g.parts.push({ x, y, vx: (Math.random() - .5) * 90, vy: -20 - Math.random() * 70, life: .8, ch });
}
function hit(g) {
  g.lives--; g.inv = 1.4; g.shake = reduced ? 0 : 1; g.gap = Math.min(100, g.gap + 20); g.t = Math.max(0, g.t - 4);
  sfx('bad'); setStatus('Oops! Adheeb got a little farther ahead 😅');
  if (g.lives <= 0) {
    g.state = 'over';
    if (g.score > g.best) { g.best = Math.floor(g.score); store.set(g.best); }
    setStatus('Adheeb got away! Tap Run again 💗'); hud(g);
  }
}
function update(g, dt) {
  g.t += dt; g.speed = Math.min(.8, .42 + g.t * .006);
  g.scroll += g.speed * dt * N; g.score += g.speed * dt * 40;
  const d = g.target - g.laneF; g.laneF += Math.sign(d) * Math.min(Math.abs(d), 9 * dt);
  if (g.jumpT >= 0) { g.jumpT += dt / .62; if (g.jumpT >= 1) g.jumpT = -1; }
  if (g.rollT >= 0) { g.rollT += dt / .55; if (g.rollT >= 1) g.rollT = -1; }
  g.inv = Math.max(0, g.inv - dt); g.shake = Math.max(0, g.shake - dt * 3); g.flash = Math.max(0, g.flash - dt);
  g.dist += g.speed * dt; if (g.dist >= g.spacing) { g.dist = 0; spawn(g); }
  for (const o of g.obs) o.z += g.speed * dt;
  for (const p of g.pick) p.z += g.speed * dt;
  g.obs = g.obs.filter(o => o.z < 1.15); g.pick = g.pick.filter(p => p.z < 1.15 && !p.got);
  const air = g.jumpT >= 0 && Math.sin(Math.PI * g.jumpT) > .45, rolling = g.rollT >= 0 && g.rollT < .9;
  for (const o of g.obs) {
    if (o.hit || Math.abs(o.z - PZ) > .045 || Math.abs(g.laneF - o.lane) > .6) continue;
    const safe = (o.type === 'low' && air) || (o.type === 'high' && rolling);
    if (!safe && g.inv <= 0) { o.hit = true; hit(g); if (g.state !== 'running') return; }
  }
  const px = sx(g.laneF, PZ), py = sy(PZ) - 20;
  for (const p of g.pick) {
    if (p.z <= 0 || Math.abs(p.z - PZ) > .055 || Math.abs(g.laneF - p.lane) > .6) continue;
    p.got = true; sfx('eat');
    if (p.kind === 'mango') { g.score += 30; g.gap = Math.max(0, g.gap - 12); } else { g.score += 10; g.gap = Math.max(0, g.gap - 4); }
    burstParts(g, px, py, 5, p.kind === 'mango' ? '🥭' : '💗');
    if (g.gap <= 0) {
      g.gap = 80; g.catches++; g.score += 100; g.flash = 1.8; sfx('fanfare');
      burstParts(g, W / 2, 80, 16, '💖'); setStatus('Miyadha caught Adheeb! He’s already running again 💗');
    }
  }
  g.mTimer -= dt;
  if (g.mTimer <= 0) { g.mTarget = Math.floor(Math.random() * 3); g.mTimer = 1.2 + Math.random() * 1.8; }
  const md = g.mTarget - g.mLane; g.mLane += Math.sign(md) * Math.min(Math.abs(md), 3.5 * dt);
  g.gap = Math.min(100, g.gap + 1.3 * dt);
  g.mz += ((.14 + (100 - g.gap) / 100 * .5) - g.mz) * Math.min(1, 4 * dt);
  for (const q of g.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 120 * dt; q.life -= dt; }
  g.parts = g.parts.filter(q => q.life > 0);
}

/* ---------------- drawing ---------------- */
function sprite(c, art, cx, by, cs, squash, step) {
  const h = art.length * cs * squash;
  for (let r = 0; r < art.length; r++) for (let k = 0; k < 8; k++) {
    const ch = art[r][k]; if (ch === '.') continue;
    const dx = r > 7 ? (k < 4 ? -step : step) * cs * .5 : 0;
    pxr(c, cx + (k - 4) * cs + dx, by - h + r * cs * squash, cs + .7, cs * squash + .7, PAL[ch]);
  }
}
function shadow(c, x, y, s) { c.fillStyle = 'rgba(60,30,60,.28)'; c.beginPath(); c.ellipse(x, y, 11 * s, 3.5 * s, 0, 0, 7); c.fill(); }
function drawObs(c, o) {
  const s = sc(o.z), x = sx(o.lane, o.z), y = sy(o.z);

    pxr(c, x - w / 2, y - 6 * s, w, 6 * s, '#47536e');

    pxr(c, x - w / 2, y - 38 * s, w, 10 * s, '#ff7aa8'); pxr(c, x - w / 2 + 4 * s, y - 35 * s, w - 8 * s, 2 * s, '#fff');
  }
}
function drawPick(c, p, g) {
  const s = sc(p.z), x = sx(p.lane, p.z), y = sy(p.z) - 14 * s - Math.sin(g.t * 6 + p.z * 20) * 3 * s;

function drawPlace(c, spot, side, z) {

  const colors={per:'#d28b68',stp:'#ecd480',opt:'#e8bf6c',alu:'#64b4d3',elo:'#bc8c6c',met:'#73bdd7',obe:'#8d7bc1',fwd:'#d78a78',vis:'#9c8ac1',nif:'#a98fc4',uds:'#8277a7',ike:'#327ac2',pis:'#ad6550',kfc:'#d74c55',hin:'#cf5990'};
  const roof=colors[id]||'#bd83ae',body=id==='kfc'?'#fff2e4':id==='ike'?'#e8f1ff':id==='met'||id==='alu'?'#e4f5f6':'#fff0dc';
  if(id==='per'||id==='elo'){poly(c,roof,[[x-w*.58,y-h*.52],[x,y-h],[x+w*.58,y-h*.52]]);pxr(c,x-w*.48,y-h*.53,w*.96,h*.53,body);pxr(c,x-w*.13,y-h*.4,w*.26,h*.4,'#875a70')}
  else {pxr(c,x-w/2,y-h,w,h,body);pxr(c,x-w/2-1*s,y-h,w+2*s,5*s,roof);

    else if(id==='alu'||id==='met'){pxr(c,x-w*.55,y-h*.5,w*1.1,2*s,'#5388a3');pxr(c,x-w*.65,y-h*.4,w*1.3,2*s,'#5388a3');if(id==='met'){pxr(c,x-w*.45,y-h*.34,w*.9,6*s,'#6ab4cf');pxr(c,x-w*.4,y-h*.3,4*s,4*s,'#fff')}}

  const labels={per:'PERUMBA...',stp:'ST PETER',opt:'OPTIONS',alu:'ALUVA',elo:'ELOOR HOME',met:'EDAPPALLY',obe:'OBERON',fwd:'FORWARDS',vis:'HYDERABAD',nif:'NIFT',uds:'23 URBAN',ike:'IKEA',pis:'PISTA HOUSE',kfc:'KFC',hin:'HINGE'},full=labels[id]||spot.sn||spot.n,label=s<.46&&full.length>7?full.slice(0,6):full,bw=Math.max(w,48*s+12),sh=Math.max(10,10*s),by=y-h-sh,signX=side<0?Math.max(bw/2+2,x):Math.min(W-bw/2-2,x);

function drawRoad(g) {
  const c = g.c;
  ['#ffd0e6', '#ffd9ea', '#ffe3ef', '#ffeef4'].forEach((col, i) => pxr(c, 0, i * HY / 4, W, HY / 4 + 1, col));
  c.fillStyle = '#fff3b8'; c.beginPath(); c.arc(256, 24, 12, 0, 7); c.fill();
  for (let i = 0; i < 4; i++) { const x = (((i * 110 - g.scroll * 6) % 440) + 440) % 440 - 60; pxr(c, x, 10 + i * 7, 34, 7, '#fff'); pxr(c, x + 8, 6 + i * 7, 20, 6, '#fff'); }
  [['#f3b7d4', 8, 5, 1], ['#e99ac1', 3, 3, 2.2]].forEach(([col, base, amp, ph]) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, HY);
    for (let x = 0; x <= W; x += 20) c.lineTo(x, HY - base - Math.sin(x * .05 + ph) * amp);
    c.lineTo(W, HY); c.closePath(); c.fill();
  });
  const base = Math.floor(g.scroll), ph = g.scroll - base;
  for (let k = -1; k < N; k++) {
    const a = Math.max(0, (k + ph) / N), b = Math.min(1, (k + 1 + ph) / N); if (b <= a) continue;
    const par = (k + base) & 1, ya = sy(a), yb = sy(b), ha = 1.55 * LS * sc(a), hb = 1.55 * LS * sc(b), wa = 4 * sc(a), wb = 4 * sc(b);
    pxr(c, 0, ya, W, yb - ya + 1, par ? '#bde7ad' : '#c8edb9');
    poly(c, par ? '#7f6c92' : '#76648a', [[W / 2 - ha, ya], [W / 2 + ha, ya], [W / 2 + hb, yb], [W / 2 - hb, yb]]);
    const cc = par ? '#ff5d93' : '#ffffff';
    poly(c, cc, [[W / 2 - ha - wa, ya], [W / 2 - ha, ya], [W / 2 - hb, yb], [W / 2 - hb - wb, yb]]);
    poly(c, cc, [[W / 2 + ha, ya], [W / 2 + ha + wa, ya], [W / 2 + hb + wb, yb], [W / 2 + hb, yb]]);
    if (!par) for (const d of [-.5, .5]) {
      const xa = W / 2 + d * LS * sc(a), xb = W / 2 + d * LS * sc(b), wda = 1.1 * sc(a), wdb = 1.1 * sc(b);
      poly(c, 'rgba(255,255,255,.75)', [[xa - wda, ya], [xa + wda, ya], [xb + wdb, yb], [xb - wdb, yb]]);
    }
  }
  const routePos=g.scroll/18,routeBase=Math.floor(routePos),routePhase=routePos-routeBase;
  for(let i=0;i<6;i++){const spot=GAME_SPOTS[(routeBase+i)%GAME_SPOTS.length],z=.12+(i+routePhase)*.115,side=((routeBase+i)%2)?-1:1;drawPlace(c,spot,side,Math.min(.88,z))}
  const deco = ['🌴', '🌸', '🏡', '🌳', '🌷', '🌼'];
  for (let i = 0; i < 6; i++) {
    const z = ((i + g.scroll / 2) % 6) / 6; if (z < .05) continue;
    const s = sc(z), off = 1.55 * LS * s + 24 * s;
    c.font = Math.round(28 * s) + 'px serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(deco[i], W / 2 - off, sy(z)); c.fillText(deco[(i + 3) % 6], W / 2 + off, sy(z));
  }
}
function panel(c, lines, y, h) {
  pxr(c, 36, y + 3, 248, h, '#49374b'); pxr(c, 32, y, 248, h, '#fff7e8'); pxr(c, 32, y, 3, h, '#ff5793');
  lines.forEach(([t, col, size], i) => txt(c, t, 156, y + 14 + i * 14, col, size));
}
function draw(g) {
  const c = g.c; c.save();
  if (g.shake > 0 && !reduced) c.translate(Math.round((Math.random() - .5) * g.shake * 5), 0);
  drawRoad(g);
  const ents = [];
  for (const o of g.obs) if (o.z > 0) ents.push([o.z, () => drawObs(c, o)]);
  for (const p of g.pick) if (p.z > 0) ents.push([p.z, () => drawPick(c, p, g)]);
  const step = Math.floor(g.t * 10 + g.scroll) % 2, cm = 3.1 * sc(g.mz);
  ents.push([g.mz, () => {
    const x = sx(g.mLane, g.mz), y = sy(g.mz);
    shadow(c, x, y, sc(g.mz)); sprite(c, ADHE, x, y, cm, 1, step);
    txt(c, 'Adheeb', x, y - 10 * cm - 2, '#513851', 5);
  }]);
  ents.push([PZ, () => {
    const s = sc(PZ), x = sx(g.laneF, PZ), gy = sy(PZ), jh = g.jumpT >= 0 ? Math.sin(Math.PI * g.jumpT) * 34 : 0;
    shadow(c, x, gy, s * (1 - jh / 90));
    if (g.inv > 0 && Math.floor(g.t * 14) % 2 === 0) return;
    sprite(c, MIYA, x, gy - jh, 3.1 * s, g.rollT >= 0 ? .55 : 1, g.jumpT >= 0 ? 0 : step); txt(c, 'Miyadha', x, gy - jh - 24 * s, '#513851', 6);
  }]);
  ents.sort((a, b) => a[0] - b[0]).forEach(e => e[1]());

  c.globalAlpha = 1;
  pxr(c, 4, 4, 88, 13, '#fff7e8'); pxr(c, 4, 4, 3, 13, '#ff5793'); txt(c, 'SCORE ' + Math.floor(g.score), 12, 10, '#3d283b', 8, 'left');
  pxr(c, 252, 4, 64, 13, '#fff7e8'); txt(c, '♥'.repeat(Math.max(0, g.lives)) + '♡'.repeat(Math.max(0, 3 - g.lives)), 284, 10, '#d52e70', 10);
  if (g.flash > 0) { pxr(c, 62, 24, 196, 20, '#fff7e8'); pxr(c, 62, 24, 3, 20, '#ff5793'); txt(c, 'MIYADHA CAUGHT ADHEEB! 💗', 160, 34, '#cf4380', 8); }
  if (g.state === 'title') panel(c, [['Help Miyadha catch Adheeb!', '#573448', 9], ['Swipe to dodge, jump and roll', '#65465b', 6], ['He’s getting away! 💗', '#cf4380', 7]], 56, 54);
  if (g.state === 'paused') panel(c, [['Taking a tiny break', '#573448', 9], ['Tap Resume when ready', '#cf4380', 7]], 62, 44);
  if (g.state === 'over') panel(c, [['Adheeb got away! 😅', '#573448', 9], ['Score ' + Math.floor(g.score) + '  ·  Best ' + g.best, '#65465b', 7], ['Tap Try again 💗', '#cf4380', 7]], 54, 62);
  c.restore();
}
